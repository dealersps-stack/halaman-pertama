
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Honda</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#222}
header{background:#d6001c;color:#fff;text-align:center;padding:40px 20px}
header h1{margin:0 0 8px}
section{padding:20px;max-width:480px;margin:auto}
.kartu{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
h2{margin-top:0}
ul{padding-left:20px;line-height:1.8}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:10px;margin-top:4px;font-size:16px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
button,.tombol{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:8px;padding:14px;margin-top:16px;font-size:16px;font-weight:bold;color:#fff;text-decoration:none}
button{background:#d6001c}
.wa{background:#25d366}
#hasil{margin-top:16px;font-size:18px;font-weight:bold;text-align:center}
small{color:#666}
</style>
</head>
<body>
<header>
  <h1>Promo Honda [Nama Motor]</h1>
  <p>DP ringan, cicilan terjangkau</p>
</header>
<section>
  <img src="images.jpeg" alt="Honda [Nama Motor]" style="width:100%;border-radius:12px;margin-bottom:16px">
  <div class="kartu">
    <h2>Keunggulan</h2>
    <ul>
      <li>Irit bahan bakar</li>
      <li>Perawatan mudah dan murah</li>
      <li>Garansi resmi Honda</li>
      <li>Proses kredit cepat</li>
    </ul>
  </div>

  <div class="kartu">
    <h2>Simulasi Cicilan</h2>
    <label>Harga motor (Rp)</label>
    <input id="harga" type="number" inputmode="numeric" placeholder="contoh: 20000000">
    <label>DP (Rp)</label>
    <input id="dp" type="number" inputmode="numeric" placeholder="contoh: 3000000">
    <label>Tenor</label>
    <select id="tenor">
      <option value="12">12 bulan</option>
      <option value="24">24 bulan</option>
      <option value="35" selected>35 bulan</option>
      <option value="36">36 bulan</option>
    </select>
    <label>Bunga flat per tahun (%)</label>
    <input id="bunga" type="number" value="10">
    <button onclick="hitung()">Hitung Cicilan</button>
    <div id="hasil"></div>
    <small>Hanya estimasi. Angka resmi mengikuti leasing.</small>
  </div>

  <a id="wa" class="tombol wa" href="#">Tanya via WhatsApp</a>
</section>

<script>
var NOMOR = "6281234567890";
function rp(n){ return "Rp " + n.toLocaleString("id-ID"); }
function pesan(teks){
  document.getElementById("wa").href =
    "https://wa.me/" + NOMOR + "?text=" + encodeURIComponent(teks);
}
pesan("Halo, saya tertarik dengan promo Honda [Nama Motor]. Bisa info lebih lanjut?");

function hitung(){
  var harga = Number(document.getElementById("harga").value);
  var dp = Number(document.getElementById("dp").value);
  var tenor = Number(document.getElementById("tenor").value);
  var bunga = Number(document.getElementById("bunga").value);
  var hasil = document.getElementById("hasil");
  if(!harga || dp >= harga){
    hasil.textContent = "Isi harga dan DP dengan benar";
    return;
  }
  var pokok = harga - dp;
  var total = pokok + pokok * (bunga/100) * (tenor/12);
  var cicilan = Math.round(total / tenor);
  hasil.textContent = "Cicilan ± " + rp(cicilan) + " / bulan";
  pesan("Halo, saya tertarik promo Honda [Nama Motor]. Simulasi saya: harga " +
    rp(harga) + ", DP " + rp(dp) + ", tenor " + tenor +
    " bulan, cicilan sekitar " + rp(cicilan) + ". Bisa dibantu?");
}
</script>
</body>
</html>
